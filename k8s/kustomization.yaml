apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vardiya

resources:
  - namespace.yaml
  # Service accounts and their RBAC must ship with the workloads: the backend
  # and frontend deployments both name one in their pod spec.
  - service-account.yaml
  - configmap.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - postgres-statefulset.yaml
  - redis-deployment.yaml
  - network-policy.yaml
  - resource-quota.yaml
  - ingress.yaml

# secrets.yaml is deliberately NOT applied. It only carries empty placeholders,
# and `kubectl apply` would otherwise create a vardiya-secrets object with blank
# credentials that fails at runtime instead of at apply time. Provision the real
# Secret out of band before the first rollout:
#
#   kubectl -n vardiya create secret generic vardiya-secrets \
#     --from-literal=db_password="$DB_PASSWORD" \
#     --from-literal=jwt_access_secret="$JWT_ACCESS" \
#     --from-literal=jwt_refresh_secret="$JWT_REFRESH" \
#     --from-literal=slack_webhook="$SLACK_WEBHOOK"
#
# or let External Secrets / Sealed Secrets manage it. See k8s/README.md.

labels:
  - pairs:
      app: vardiya
      managed-by: kustomize
