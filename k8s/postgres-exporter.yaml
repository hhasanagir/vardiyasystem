apiVersion: v1
kind: Service
metadata:
  name: vardiya-postgres-exporter
  namespace: vardiya
  labels:
    app: vardiya
    component: postgres-exporter
spec:
  selector:
    app: vardiya
    component: postgres-exporter
  ports:
    - port: 9187
      targetPort: 9187
      name: metrics
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vardiya-postgres-exporter
  namespace: vardiya
  labels:
    app: vardiya
    component: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vardiya
      component: postgres-exporter
  template:
    metadata:
      labels:
        app: vardiya
        component: postgres-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
    spec:
      serviceAccountName: vardiya-backend
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          ports:
            - containerPort: 9187
              name: metrics
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: vardiya-secrets
                  key: db_password
            - name: DATA_SOURCE_URI
              value: "postgresql://vardiya@vardiya-postgres:5432/vardiyasystem?sslmode=disable"
            - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
              value: "true"
            - name: PG_EXPORTER_EXCLUDE_DATABASES
              value: "template0,template1,postgres"
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 64Mi
              cpu: 200m
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
