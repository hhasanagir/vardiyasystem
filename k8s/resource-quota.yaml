apiVersion: v1
kind: ResourceQuota
metadata:
  name: vardiya-quota
  namespace: vardiya
  labels:
    app: vardiya
    managed-by: kustomize
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    requests.storage: 50Gi
    persistentvolumeclaims: "10"
    services: "20"
    secrets: "50"
    configmaps: "30"
    pods: "50"
    deployments.apps: "10"
    statefulsets.apps: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: vardiya-limits
  namespace: vardiya
  labels:
    app: vardiya
    managed-by: kustomize
spec:
  limits:
    - max:
        cpu: "4"
        memory: 4Gi
      min:
        cpu: 25m
        memory: 32Mi
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      type: Container
    - max:
        storage: 50Gi
      min:
        storage: 1Gi
      type: PersistentVolumeClaim
