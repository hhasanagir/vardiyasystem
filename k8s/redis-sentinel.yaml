apiVersion: v1
kind: ConfigMap
metadata:
  name: vardiya-redis-sentinel
  namespace: vardiya
  labels:
    app: vardiya
    component: redis-sentinel
data:
  sentinel.conf: |
    port 26379
    dir /tmp
    daemonize no
    logfile ""
    sentinel monitor mymaster vardiya-redis-0.vardiya-redis-cluster.vardiya.svc.cluster.local 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 10000
    sentinel parallel-syncs mymaster 1
    sentinel auth-pass mymaster ""
---
apiVersion: v1
kind: Service
metadata:
  name: vardiya-redis-sentinel
  namespace: vardiya
  labels:
    app: vardiya
    component: redis-sentinel
spec:
  selector:
    app: vardiya
    component: redis-sentinel
  ports:
    - port: 26379
      targetPort: 26379
      name: sentinel
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vardiya-redis-sentinel
  namespace: vardiya
  labels:
    app: vardiya
    component: redis-sentinel
spec:
  serviceName: vardiya-redis-sentinel
  replicas: 3
  selector:
    matchLabels:
      app: vardiya
      component: redis-sentinel
  template:
    metadata:
      labels:
        app: vardiya
        component: redis-sentinel
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: vardiya
                    component: redis-sentinel
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      containers:
        - name: sentinel
          image: redis:7-alpine
          ports:
            - containerPort: 26379
              name: sentinel
          command:
            - redis-server
            - /etc/redis/sentinel.conf
            - --sentinel
          volumeMounts:
            - name: config
              mountPath: /etc/redis
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          livenessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "sentinel", "master", "mymaster"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: vardiya-redis-sentinel
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
        storageClassName: standard
