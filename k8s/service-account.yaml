apiVersion: v1
kind: ServiceAccount
metadata:
  name: vardiya-backend
  namespace: vardiya
  labels:
    app: vardiya
    component: backend
    managed-by: kustomize
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vardiya-frontend
  namespace: vardiya
  labels:
    app: vardiya
    component: frontend
    managed-by: kustomize
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vardiya-backend
  labels:
    app: vardiya
    component: backend
    managed-by: kustomize
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vardiya-backend
  labels:
    app: vardiya
    component: backend
    managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vardiya-backend
subjects:
  - kind: ServiceAccount
    name: vardiya-backend
    namespace: vardiya
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vardiya-leader-election
  namespace: vardiya
  labels:
    app: vardiya
    managed-by: kustomize
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["vardiya-leader-election"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vardiya-backend-leader-election
  namespace: vardiya
  labels:
    app: vardiya
    component: backend
    managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vardiya-leader-election
subjects:
  - kind: ServiceAccount
    name: vardiya-backend
    namespace: vardiya
