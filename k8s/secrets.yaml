# TEMPLATE ONLY — intentionally excluded from kustomization.yaml.
#
# The values below are empty on purpose: applying this file would create a
# vardiya-secrets object with blank credentials, and the failure would then
# surface at runtime as an authentication error rather than at apply time.
#
# Create the real Secret out of band (or use External Secrets / Sealed
# Secrets). The exact command is documented in kustomization.yaml.
#
# Verified by scripts/release-preflight.mjs, which fails if a non-empty secret
# value ever lands in this file.
apiVersion: v1
kind: Secret
metadata:
  name: vardiya-secrets
  namespace: vardiya
type: Opaque
stringData:
  db_password: ""
  jwt_access_secret: ""
  jwt_refresh_secret: ""
  slack_webhook: ""
