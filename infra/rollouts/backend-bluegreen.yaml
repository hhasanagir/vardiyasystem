apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: vardiya-backend
  namespace: vardiya
  labels:
    app.kubernetes.io/part-of: vardiya
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: argo-rollouts
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: vardiya
        app.kubernetes.io/component: backend
        version: stable
    spec:
      containers:
        - name: backend
          image: ghcr.io/anomalyco/vardiyasystem/backend:v1.0.0
          ports:
            - containerPort: 3000
              protocol: TCP
            - containerPort: 9464
              name: metrics
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vardiya-backend-config
            - secretRef:
                name: vardiya-backend-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
runAsNonRoot: true
        runAsUser: 100
        allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
  strategy:
    blueGreen:
      activeService: vardiya-backend-active
      previewService: vardiya-backend-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 300
      previewReplicaCount: 1
      antiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: backend
            topologyKey: kubernetes.io/hostname
      postPromotionAnalysis:
        templates:
          - templateName: rollout-analysis-success-rate
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      prePromotionAnalysis:
        templates:
          - templateName: rollout-analysis-smoke
---
apiVersion: v1
kind: Service
metadata:
  name: vardiya-backend-active
  namespace: vardiya
  labels:
    app.kubernetes.io/part-of: vardiya
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
    - name: metrics
      port: 9464
      targetPort: 9464
---
apiVersion: v1
kind: Service
metadata:
  name: vardiya-backend-preview
  namespace: vardiya
  labels:
    app.kubernetes.io/part-of: vardiya
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
