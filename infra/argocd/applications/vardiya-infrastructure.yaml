apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vardiya-infrastructure
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: vardiya
    app.kubernetes.io/managed-by: argocd
spec:
  project: vardiya
  source:
    path: infra
    repoURL: https://github.com/anomalyco/vardiyasystem.git
    targetRevision: HEAD
    directory:
      recurse: true
      include: "{networking/*.yaml,cert-manager/*.yaml,sealed-secrets/*.yaml,opentelemetry/*.yaml}"
      exclude: "{**/docs/**}"
  destination:
    server: https://kubernetes.default.svc
    namespace: vardiya
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: vardiya
---
