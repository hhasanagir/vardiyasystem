{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vardiya.fullname" . }}-grafana-datasources
  labels: {{- include "vardiya.labels" . | nindent 4 }}
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://{{ include "vardiya.fullname" . }}-prometheus:9090
        access: proxy
        isDefault: true
      - name: Loki
        type: loki
        url: http://{{ include "vardiya.fullname" . }}-loki:3100
        access: proxy
      - name: Tempo
        type: tempo
        url: http://{{ include "vardiya.fullname" . }}-tempo:3200
        access: proxy
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vardiya.fullname" . }}-grafana
  labels: {{- include "vardiya.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.grafana.storage.storageClass }}
  resources:
    requests:
      storage: {{ .Values.grafana.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vardiya.fullname" . }}-grafana
  labels: {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/component: grafana
    spec:
      serviceAccountName: {{ include "vardiya.serviceAccountName" (dict "root" . "component" "monitoring") }}
      securityContext:
        {{- include "vardiya.podSecurityContext" (dict "runAsUser" 472 "runAsGroup" 472 "fsGroup" 472) | nindent 8 }}
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          securityContext:
            {{- include "vardiya.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.adminPasswordSecret }}
                  key: admin_password
                  optional: true
            - name: GF_INSTALL_PLUGINS
              value: grafana-piechart-panel
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 256m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: storage
              mountPath: /var/lib/grafana
            - name: logs
              mountPath: /var/log/grafana
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: datasources
          configMap:
            name: {{ include "vardiya.fullname" . }}-grafana-datasources
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "vardiya.fullname" . }}-grafana
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vardiya.fullname" . }}-grafana
  labels: {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/component: grafana
{{- end }}
