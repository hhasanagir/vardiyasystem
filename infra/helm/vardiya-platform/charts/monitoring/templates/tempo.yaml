{{- if .Values.tempo.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vardiya.fullname" . }}-tempo-config
  labels: {{- include "vardiya.labels" . | nindent 4 }}
data:
  tempo-config.yml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    ingester:
      trace_idle_period: 10s
      max_block_duration: 5m
    compactor:
      compaction:
        block_retention: {{ .Values.tempo.retention }}
    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo/blocks
        wal:
          path: /tmp/tempo/wal
    querier:
      max_search_duration: 30s
    overrides:
      max_bytes_per_trace: 5e6
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vardiya.fullname" . }}-tempo
  labels: {{- include "vardiya.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.tempo.storage.storageClass }}
  resources:
    requests:
      storage: {{ .Values.tempo.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vardiya.fullname" . }}-tempo
  labels: {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/component: tempo
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.6.0
          args:
            - -config.file=/etc/tempo/tempo-config.yml
          ports:
            - containerPort: 3200
              name: http
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          resources:
            requests:
              cpu: 256m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: storage
              mountPath: /tmp/tempo
      volumes:
        - name: config
          configMap:
            name: {{ include "vardiya.fullname" . }}-tempo-config
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "vardiya.fullname" . }}-tempo
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vardiya.fullname" . }}-tempo
  labels: {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
spec:
  ports:
    - port: 3200
      targetPort: 3200
      name: http
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      name: otlp-http
  selector:
    app.kubernetes.io/component: tempo
{{- end }}
