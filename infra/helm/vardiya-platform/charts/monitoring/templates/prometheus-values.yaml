{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vardiya.fullname" . }}-prometheus-config
  labels: {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: {{ .Values.global.environment }}
        namespace: {{ .Release.Namespace }}
    rule_files:
      - /etc/prometheus/rules/*.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - {{ include "vardiya.fullname" . }}-alertmanager:9093
    scrape_configs:
      - job_name: vardiya-backend
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: backend
            action: keep
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $$1:$$2
            target_label: __address__
            action: replace
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            regex: (.+)
            target_label: __metrics_path__
            action: replace
      - job_name: vardiya-pgbouncer
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: pgbouncer
            action: keep
          - source_labels: [__address__]
            regex: ([^:]+)(?::\d+)?
            replacement: $$1:9127
            target_label: __address__
      - job_name: vardiya-postgres-exporter
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: postgres-exporter
            action: keep
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
  alert-rules.yml: |
    groups:
      - name: vardiya-backend
        interval: 30s
        rules:
          - alert: BackendDown
            expr: up{job="vardiya-backend"} == 0
            for: 1m
            labels: { severity: critical }
            annotations: { summary: "Backend down in {{ .Release.Namespace }}", description: "No backend pods are up for >1m" }
          - alert: HighErrorRate
            expr: rate(vardiya_http_requests_total{status=~"5.."}[5m]) / rate(vardiya_http_requests_total[5m]) > 0.05
            for: 3m
            labels: { severity: critical }
            annotations: { summary: "High error rate (>5%)" }
          - alert: HighLatency
            expr: histogram_quantile(0.99, rate(vardiya_http_request_duration_seconds_bucket[5m])) > 2
            for: 3m
            labels: { severity: warning }
            annotations: { summary: "p99 latency >2s" }
          - alert: HighRequestRate
            expr: rate(vardiya_http_requests_total[1m]) > 200
            for: 5m
            labels: { severity: warning }
            annotations: { summary: "Request rate >200/s" }
      - name: vardiya-database
        interval: 30s
        rules:
          - alert: PostgresDown
            expr: pg_up == 0
            for: 1m
            labels: { severity: critical }
            annotations: { summary: "PostgreSQL is down" }
          - alert: PostgresHighConnections
            expr: pg_stat_database_numbackends > 40
            for: 5m
            labels: { severity: warning }
            annotations: { summary: "Postgres connections >40" }
          - alert: PgBouncerDown
            expr: up{job="vardiya-pgbouncer"} == 0
            for: 1m
            labels: { severity: critical }
            annotations: { summary: "PgBouncer is down" }
      - name: vardiya-redis
        interval: 30s
        rules:
          - alert: RedisDown
            expr: redis_up == 0
            for: 1m
            labels: { severity: critical }
            annotations: { summary: "Redis is down" }
          - alert: RedisHighMemory
            expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 80 and redis_memory_max_bytes > 0
            for: 5m
            labels: { severity: warning }
            annotations: { summary: "Redis memory >80%" }
      - name: vardiya-infra
        interval: 5m
        rules:
          - alert: DiskSpaceLow
            expr: node_filesystem_avail_bytes / node_filesystem_size_bytes * 100 < 10
            for: 5m
            labels: { severity: critical }
            annotations: { summary: "Disk space <10%" }
          - alert: CertificateExpiringSoon
            expr: certmanager_certificate_expiration_timestamp_seconds - time() < 2592000
            for: 1h
            labels: { severity: warning }
            annotations: { summary: "TLS cert expires in <30d" }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vardiya.fullname" . }}-prometheus
  labels: {{- include "vardiya.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.prometheus.storage.storageClass }}
  resources:
    requests:
      storage: {{ .Values.prometheus.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vardiya.fullname" . }}-prometheus
  labels: {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/component: prometheus
    spec:
      serviceAccountName: {{ include "vardiya.serviceAccountName" (dict "root" . "component" "monitoring") }}
      securityContext:
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
            - --web.console.libraries=/usr/share/prometheus/console_libraries
            - --web.console.templates=/usr/share/prometheus/consoles
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ include "vardiya.fullname" . }}-prometheus-config
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "vardiya.fullname" . }}-prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vardiya.fullname" . }}-prometheus
  labels: {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app.kubernetes.io/component: prometheus
{{- end }}
