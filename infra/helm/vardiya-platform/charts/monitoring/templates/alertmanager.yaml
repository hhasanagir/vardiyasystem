{{- if .Values.alertmanager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vardiya.fullname" . }}-alertmanager-config
  labels: {{- include "vardiya.labels" . | nindent 4 }}
data:
  alertmanager.yml: |
    global:
      slack_api_url_file: /etc/alertmanager/slack_webhook
      resolve_timeout: 5m
    route:
      group_by: [alertname, severity]
      group_wait: 30s
      group_interval: 3m
      repeat_interval: 4h
      routes:
        - match:
            severity: critical
          receiver: slack-critical
          repeat_interval: 1h
          continue: true
        - match:
            severity: warning
          receiver: slack-warning
        - receiver: default
    receivers:
      - name: default
        slack_configs:
          - channel: "#alerts"
            title: '[{{ .Values.global.environment }}] {{ "{{ .GroupLabels.alertname }}" }}'
            text: '{{ "{{ range .Alerts }}{{ .Annotations.summary }}\\n{{ .Annotations.description }}\\n{{ end }}" }}'
            color: warning
      - name: slack-critical
        slack_configs:
          - channel: "#alerts-critical"
            send_resolved: true
            title: '[CRITICAL][{{ .Values.global.environment }}] {{ "{{ .GroupLabels.alertname }}" }}'
            text: '{{ "{{ range .Alerts }}{{ .Annotations.summary }}\\n{{ .Annotations.description }}\\n{{ end }}" }}'
            color: danger
      - name: slack-warning
        slack_configs:
          - channel: "#alerts"
            send_resolved: true
            title: '[{{ .Values.global.environment }}] {{ "{{ .GroupLabels.alertname }}" }}'
            text: '{{ "{{ range .Alerts }}{{ .Annotations.summary }}\\n{{ .Annotations.description }}\\n{{ end }}" }}'
            color: warning
    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal: [alertname]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vardiya.fullname" . }}-alertmanager
  labels: {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/component: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --data.retention=120h
          ports:
            - containerPort: 9093
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: slack-webhook
              mountPath: /etc/alertmanager/slack_webhook
              subPath: slack_webhook
      volumes:
        - name: config
          configMap:
            name: {{ include "vardiya.fullname" . }}-alertmanager-config
        - name: slack-webhook
          secret:
            secretName: {{ .Values.alertmanager.existingSecret }}
            items:
              - key: slack_webhook
                path: slack_webhook
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vardiya.fullname" . }}-alertmanager
  labels: {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
spec:
  ports:
    - port: 9093
      targetPort: 9093
      name: http
  selector:
    app.kubernetes.io/component: alertmanager
{{- end }}
