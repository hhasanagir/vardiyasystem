apiVersion: v1
kind: Service
metadata:
  name: {{ include "vardiya.fullname" . }}-frontend
  labels: {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: frontend
