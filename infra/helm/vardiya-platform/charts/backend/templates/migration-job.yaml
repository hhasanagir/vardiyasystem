apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vardiya.fullname" . }}-migrate
  annotations:
    # Runs once before first Deployments are rolled out on each upgrade or
    # install — mirrors the compose stack, where the backend entrypoint runs
    # `prisma migrate deploy` before serving.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrationJob.activeDeadlineSeconds }}
  template:
    metadata:
      labels: {{- include "vardiya.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- include "vardiya.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "vardiya.serviceAccountName" (dict "root" . "component" "backend") }}
      restartPolicy: OnFailure
      # The backend image ships USER vardiya (alpine adduser -S → uid 100).
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 100
      containers:
        - name: migrate
          image: "{{ include "vardiya.registry" . }}{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["npx", "prisma", "migrate", "deploy"]
          # Migrations must go through the DIRECT database URL — pgbouncer only
          # pools client connections in this deployment.
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: database_direct_url
            # Prisma's schema declares both url and directUrl (schema.prisma),
            # so `migrate deploy` aborts with P1012 unless DATABASE_DIRECT_URL is
            # also present (defect D14).
            - name: DATABASE_DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: database_direct_url
            - name: NODE_ENV
              value: {{ .Values.config.NODE_ENV | quote }}
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
