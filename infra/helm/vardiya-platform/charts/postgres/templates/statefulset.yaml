{{- if gt (int .Values.replicaCount) 1 }}
{{- fail "postgres.replicaCount > 1 is unsupported: this subchart has no replication, so a second replica is an independent writable primary behind the headless Service and would silently split the dataset (defect D7). Set postgres.replicaCount=1 or install a replication-capable subchart." }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vardiya.fullname" . }}-postgres
  labels: {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "vardiya.fullname" . }}-postgres
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "vardiya.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels: {{- include "vardiya.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      {{- include "vardiya.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "vardiya.serviceAccountName" (dict "root" . "component" "postgres") }}
      # The postgres image ships no USER (it drops from root via gosu at runtime),
      # so runAsNonRoot alone cannot pass — pin uid/gid 70 (the alpine "postgres"
      # user) and fsGroup 70 so the freshly provisioned PVC is writable.
      securityContext:
        {{- include "vardiya.podSecurityContext" (dict "runAsUser" 70 "runAsGroup" 70 "fsGroup" 70) | nindent 8 }}
      terminationGracePeriodSeconds: 120
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "vardiya.containerSecurityContext" (dict) | nindent 12 }}
          ports:
            - containerPort: 5432
              protocol: TCP
              name: postgres
          env:
            - name: POSTGRES_USER
              value: vardiya
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: postgres_password
            - name: POSTGRES_DB
              value: vardiyasystem
            - name: POSTGRES_MULTIPLE_EXTENSIONS
              value: {{ join "," .Values.extensions }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          livenessProbe:
            exec:
              command: [pg_isready, -U, vardiya, -d, vardiyasystem]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: [pg_isready, -U, vardiya, -d, vardiyasystem]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storage.storageClass }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
