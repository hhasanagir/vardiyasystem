apiVersion: v1
kind: Service
metadata:
  name: {{ include "vardiya.fullname" . }}-pgbouncer
  labels: {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  type: ClusterIP
  ports:
    - port: 6432
      targetPort: 6432
      protocol: TCP
      name: pgbouncer
    - port: 9127
      targetPort: 9127
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/component: pgbouncer
