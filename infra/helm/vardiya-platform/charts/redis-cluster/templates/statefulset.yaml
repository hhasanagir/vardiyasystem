apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vardiya.fullname" . }}-redis
  labels: {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "vardiya.fullname" . }}-redis
  replicas: {{ index .Values "cluster" "replicas" }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels: {{- include "vardiya.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels: {{- include "vardiya.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      {{- include "vardiya.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: redis
                topologyKey: kubernetes.io/hostname
      containers:
        - name: redis
          image: "{{ index .Values "image" "repository" }}:{{ index .Values "image" "tag" }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 6379
              protocol: TCP
              name: redis
          args:
            - --appendonly
            - "yes"
            - --cluster-enabled
            - "yes"
            - --cluster-config-file
            - /data/nodes.conf
            - --cluster-node-timeout
            - "5000"
            - --requirepass
            - $(REDIS_PASSWORD)
            - --masterauth
            - $(REDIS_PASSWORD)
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - noeviction
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ index .Values "existingSecret" }}
                  key: redis_password
          resources: {{ toYaml (index .Values "resources") | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a $(REDIS_PASSWORD) ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ index .Values "storage" "storageClass" }}
        resources:
          requests:
            storage: {{ index .Values "storage" "size" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vardiya.fullname" . }}-redis-cluster
  labels: {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  clusterIP: None
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
    - port: 16379
      targetPort: 16379
      name: cluster-bus
  selector:
    app.kubernetes.io/component: redis
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vardiya.fullname" . }}-redis
  labels: {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/component: redis
