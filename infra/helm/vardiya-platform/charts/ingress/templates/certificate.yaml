{{- if .Values.tls.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.tls.secretName }}
  labels: {{- include "vardiya.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.tls.secretName }}
  secretTemplate:
    labels: {{- include "vardiya.labels" . | nindent 6 }}
  issuerRef:
    name: {{ .Values.tls.clusterIssuer }}
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.global.publicHost }}
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        name: {{ .Values.tls.secretName }}-pkcs12
  usages:
    - digital signature
    - key encipherment
    - server auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  renewBefore: 720h
{{- end }}
