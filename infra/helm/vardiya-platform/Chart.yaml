apiVersion: v2
name: vardiya-platform
description: VardiyaOS enterprise hospital shift management platform
type: application
version: 1.0.0
appVersion: "1.0.0"
kubeVersion: ">=1.28.0"
home: https://github.com/anomalyco/vardiyasystem
icon: https://raw.githubusercontent.com/anomalyco/vardiyasystem/main/public/icons/icon-192.svg
keywords:
  - hospital
  - shift-management
  - radiology
  - healthcare
sources:
  - https://github.com/anomalyco/vardiyasystem
maintainers:
  - name: VardiyaOS Team
    email: dev@vardiya.com

dependencies:
  - name: backend
    version: "1.0.0"
    repository: "file://charts/backend"
    condition: backend.enabled
  - name: frontend
    version: "1.0.0"
    repository: "file://charts/frontend"
    condition: frontend.enabled
  - name: postgres
    version: "1.0.0"
    repository: "file://charts/postgres"
    condition: postgres.enabled
  - name: pgbouncer
    version: "1.0.0"
    repository: "file://charts/pgbouncer"
    condition: pgbouncer.enabled
  - name: redis-cluster
    version: "1.0.0"
    repository: "file://charts/redis-cluster"
    condition: redis-cluster.enabled
  - name: monitoring
    version: "1.0.0"
    repository: "file://charts/monitoring"
    condition: monitoring.enabled
  - name: ingress
    version: "1.0.0"
    repository: "file://charts/ingress"
    condition: ingress.enabled

annotations:
  artifacthub.io/changes: |
    - kind: added
      description: Initial enterprise Helm chart for VardiyaOS
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/prerelease: "false"
