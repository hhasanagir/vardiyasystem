{{- if .Values.rbac.create }}
{{- $backendSA := include "vardiya.serviceAccountName" (dict "root" . "component" "backend") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vardiya.fullname" . }}-backend
  labels:
    {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vardiya.fullname" . }}-backend
  labels:
    {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vardiya.fullname" . }}-backend
subjects:
  - kind: ServiceAccount
    name: {{ $backendSA }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vardiya.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ include "vardiya.fullname" . }}-leader-election"]
    verbs: ["get", "watch", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vardiya.fullname" . }}-backend-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vardiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vardiya.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ $backendSA }}
    namespace: {{ .Release.Namespace }}
{{- end }}
