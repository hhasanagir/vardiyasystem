global:
  environment: production
  imagePullPolicy: Always

backend:
  replicaCount: 3
  autoscaling:
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 65
  podDisruptionBudget:
    minAvailable: 2
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 1Gi

postgres:
  replicaCount: 2
  storage:
    size: 50Gi
    storageClass: gp3
  backup:
    schedule: "0 */2 * * *"
    retention: 60

pgbouncer:
  replicaCount: 3
  config:
    defaultPoolSize: 40
    maxClientConn: 400

redis-cluster:
  cluster:
    replicas: 5
    sentinel:
      replicas: 3

global:
  publicHost: app.vardiya.com

monitoring:
  prometheus:
    retention: 60d
    storage:
      size: 100Gi
  loki:
    retention: 1440h
    storage:
      size: 200Gi

ingress:
  rateLimiting:
    rps: 200
