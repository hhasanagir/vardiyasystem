---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: vardiya-compute-quota
  namespace: vardiya
  labels:
    app.kubernetes.io/part-of: vardiya
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "10"
    services: "20"
    secrets: "50"
    configmaps: "30"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: vardiya-monitoring-quota
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: vardiya
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 16Gi
    limits.cpu: "8"
    limits.memory: 32Gi
    persistentvolumeclaims: "8"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: vardiya-container-limits
  namespace: vardiya
  labels:
    app.kubernetes.io/part-of: vardiya
spec:
  limits:
    - max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      type: Container
---
apiVersion: v1
kind: LimitRange
metadata:
  name: vardiya-monitoring-limits
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: vardiya
spec:
  limits:
    - max:
        cpu: "4"
        memory: 8Gi
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 200m
        memory: 512Mi
      type: Container
