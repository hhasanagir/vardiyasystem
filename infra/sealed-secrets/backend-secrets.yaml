apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: vardiya-backend-secrets
  namespace: vardiya
  labels:
    app.kubernetes.io/part-of: vardiya
    app.kubernetes.io/component: backend
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
    sealedsecrets.bitnami.com/rotate: "90d"
spec:
  template:
    metadata:
      name: vardiya-backend-secrets
      namespace: vardiya
      labels:
        app.kubernetes.io/part-of: vardiya
        app.kubernetes.io/component: backend
    type: Opaque
  encryptedData:
    # Placeholders only — the key NAMES are the contract the Helm chart reads
    # (infra/helm/vardiya-platform/charts/backend/templates/deployment.yaml and
    # migration-job.yaml). Replace values with `kubeseal` output before apply.
    database_url: AgAA...
    database_direct_url: AgAA...
    jwt_access_secret: AgAA...
    jwt_refresh_secret: AgAA...
    cookie_secret: AgAA...
    vapid_public_key: AgAA...
    vapid_private_key: AgAA...
    encryption_master_key: AgAA...
    redis_url: AgAA...
    feature_flags_url: AgAA...
