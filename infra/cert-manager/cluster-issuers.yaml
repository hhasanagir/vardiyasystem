---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vardiya-letsencrypt-production
  labels:
    app.kubernetes.io/part-of: vardiya
    app.kubernetes.io/managed-by: cert-manager
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: devops@vardiya.com
    privateKeySecretRef:
      name: letsencrypt-production-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - vardiya.com
            - vardiya.example.com
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vardiya-letsencrypt-staging
  labels:
    app.kubernetes.io/part-of: vardiya
    app.kubernetes.io/managed-by: cert-manager
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: devops@vardiya.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - vardiya.com
            - vardiya.example.com
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vardiya-selfsigned
  labels:
    app.kubernetes.io/part-of: vardiya
    app.kubernetes.io/managed-by: cert-manager
spec:
  selfSigned: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
  labels:
    app.kubernetes.io/part-of: vardiya
type: Opaque
stringData:
  api-token: changeme-in-production
